# Cloudflare Pages 项目配置
# 官方限制：Pages 不能自己创建 Durable Object，
# 因此 ROOM 绑定指向独立的 DO 宿主 Worker（cloud-chat-do）。
name = "v7-chat"
compatibility_date = "2025-09-01"
pages_build_output_dir = "dist"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"
script_name = "cloud-chat-do"

[[d1_databases]]
binding = "DB"
database_name = "v7-chat-db"
database_id = "ca1f7479-5c41-4a1e-8ae4-836617d277d5"

# 9 个 D1 分片库（v7-chat-db-02..10）：云文件 D1 分片存储（RA 超 1GB 溢出层 / Supabase 失败兜底）
[[d1_databases]]
binding = "SHARD0"
database_name = "v7-chat-db-02"
database_id = "3c670f1d-3cb8-43e1-95b5-e3d92493373e"
[[d1_databases]]
binding = "SHARD1"
database_name = "v7-chat-db-03"
database_id = "b2915348-4c06-4095-9777-84fc23b3abde"
[[d1_databases]]
binding = "SHARD2"

# Durable Object 宿主 Worker
# 官方限制：Cloudflare Pages 项目无法执行 Durable Object 类迁移，
# 必须把 DO 类部署在独立 Worker 上，再由 Pages 用 script_name 绑定该命名空间。
name = "cloud-chat-do"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = false

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[d1_databases]]
binding = "DB"
database_name = "v7-chat-db"
database_id = "ca1f7479-5c41-4a1e-8ae4-836617d277d5"
